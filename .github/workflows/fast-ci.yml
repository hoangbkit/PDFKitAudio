name: Fast CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      - name: Run package tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Demo project
        working-directory: Examples/Demo
        run: xcodegen generate --spec project.yml

      - name: Build macOS Demo
        working-directory: Examples/Demo
        run: |
          xcodebuild \
            -project PDFKitAudioDemo.xcodeproj \
            -scheme PDFKitAudioDemo \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$PWD/.derivedData-macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          test -f "$PWD/.derivedData-macOS/Build/Products/Debug/PDFKitAudioDemo.app/Contents/Resources/digital-text.pdf"
          test -f "$PWD/.derivedData-macOS/Build/Products/Debug/PDFKitAudioDemo.app/Contents/Resources/outline-chapters.pdf"
          test -f "$PWD/.derivedData-macOS/Build/Products/Debug/PDFKitAudioDemo.app/Contents/Resources/blank-page.pdf"
