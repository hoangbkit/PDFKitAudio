name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  phase9-category-isolation:
    name: Phase 9 category — ${{ matrix.test }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - testSimple
          - testColumns
          - testMixedRegions
          - testSideContent
          - testTables
          - testFootnotesCaptions
          - testRunningMatter
          - testDifficultPositioning
          - testScriptsLanguages
          - testOCREquivalentsNativeOnly

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Run isolated category gate
        run: swift test --filter PdfLayoutPhase9CategoryQualityTests/${{ matrix.test }}
