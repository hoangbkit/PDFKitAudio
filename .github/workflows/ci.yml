name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  phase9-fixture-diagnostics:
    name: Phase 9 diagnostic — ${{ matrix.fixture }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - short-chapter-heading-body
          - full-width-title-body
          - three-column
          - semantic-sentence-near-top

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Run isolated fixture gate
        env:
          PDFKITAUDIO_PHASE9_FIXTURE: ${{ matrix.fixture }}
        run: swift test --filter PdfLayoutPhase9CategoryQualityTests/testSelectedFixtureFromEnvironment
