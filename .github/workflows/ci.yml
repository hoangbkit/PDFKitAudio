name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: SwiftPM + example (macOS ${{ matrix.macos }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "15"
            arch: Intel
            runner: macos-15-intel
          - macos: "15"
            arch: Apple Silicon
            runner: macos-15
          - macos: "26"
            arch: Intel
            runner: macos-26-intel
          - macos: "26"
            arch: Apple Silicon
            runner: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Runner and toolchain versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build generated example app
        run: make example-build-ci
