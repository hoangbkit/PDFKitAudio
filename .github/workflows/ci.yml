name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Phase 9 perturbation diagnostics (macOS 14)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Run Phase 9 perturbation diagnostics
        run: swift test --filter PdfLayoutPhase9PerturbationDiagnosticsTests/testThreeColumnPerturbationDiagnostics
