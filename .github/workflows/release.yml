name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
